name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check the tag matches VERSION and every packaged USD
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$v" || { echo "::error::VERSION is $(cat VERSION), tag is $GITHUB_REF_NAME"; exit 1; }
          n=0
          for f in assets/*/*/*/usd/*.usda; do
            n=$((n + 1))
            grep -q "asset_version = \"$v\"" "$f" \
              || { echo "::error::$f is not stamped $v: run ./pipeline.sh update and commit assets/"; exit 1; }
          done
          test "$n" -gt 0 || { echo "::error::no packaged assets under assets/"; exit 1; }

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - name: Pull LFS assets
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release files
        run: python scripts/make_release.py --out dist

      - name: Build the web viewer models
        run: |
          pip install usd-core==26.8 pillow==12.3.0
          python scripts/web_export.py --zip "dist/$GITHUB_REF_NAME/web-models.zip"
          (cd "dist/$GITHUB_REF_NAME" && sha256sum web-models.zip >> SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="dist/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "$d"/*.zip "$d/SHA256SUMS" \
            --title "$GITHUB_REF_NAME" --notes-file "$d/RELEASE_NOTES.md" --verify-tag

      - name: Deploy the web viewer for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -f tag="$GITHUB_REF_NAME"
